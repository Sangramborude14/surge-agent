name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install backend dependencies (excluding custom SDK from PyPI, using local package setup)
          pip install -e backend/dummy_google_antigravity
          pip install pymongo fastapi uvicorn python-dotenv pydantic cryptography certifi

      - name: Lint and Compile Check
        run: |
          # Verify all backend python scripts have valid syntax
          python -m py_compile backend/*.py

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Modules
        working-directory: ./frontend
        run: npm install

      - name: Verify Build
        working-directory: ./frontend
        run: npm run build
